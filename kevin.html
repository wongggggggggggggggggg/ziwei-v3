<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src https://ziwe-kevin.www-wongkevin404.workers.dev; form-action 'none'; base-uri 'none'" />
<meta name="referrer" content="no-referrer" />
<title>kevin</title>
<style>
  :root {
    --bg: #0b1020; --card: #141a2e; --line: rgba(148,163,184,.18);
    --txt: #e6e9f2; --dim: #9aa4bd; --accent: #7c5cff; --ok: #22c55e; --warn: #f59e0b; --bad: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: radial-gradient(1200px 600px at 15% -10%, #1b2350 0%, var(--bg) 55%);
    color: var(--txt); font: 15px/1.6 -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
    min-height: 100vh; padding: 28px 18px 60px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; letter-spacing: .02em; }
  .sub { color: var(--dim); font-size: .85rem; margin: 0 0 22px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .login { max-width: 380px; margin: 10vh auto 0; }
  .login h1 { text-align: center; }
  .login .sub { text-align: center; }
  label { display: block; font-size: .8rem; color: var(--dim); margin: 14px 0 6px; }
  input[type=text], input[type=password] {
    width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--line);
    background: #0e1428; color: var(--txt); font-size: .95rem;
  }
  input:focus { outline: 2px solid rgba(124,92,255,.6); outline-offset: 1px; }
  button {
    margin-top: 16px; width: 100%; padding: 11px 14px; border-radius: 10px; border: 0;
    background: linear-gradient(135deg, #7c5cff, #5b8cff); color: #fff; font-weight: 600;
    font-size: .95rem; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: default; }
  button.ghost {
    background: transparent; border: 1px solid var(--line); color: var(--txt); width: auto;
    margin: 0 8px 0 0; padding: 8px 12px; font-size: .82rem;
  }
  .err { color: var(--bad); font-size: .84rem; margin-top: 12px; min-height: 1.2em; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 18px 0 22px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .kpi .n { font-size: 1.6rem; font-weight: 700; line-height: 1.2; }
  .kpi .l { color: var(--dim); font-size: .78rem; margin-top: 2px; }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  @media (max-width: 780px) { .charts { grid-template-columns: 1fr; } }
  .chart-card { padding: 14px 16px; }
  .chart-card.wide { grid-column: 1 / -1; }
  .chart-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: .86rem; }
  .legend { color: var(--dim); font-size: .74rem; }
  .lg { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin: 0 4px 0 10px; }
  .lg.reading { background: #7c5cff; }
  .lg.followup { background: #f59e0b; }
  .chart-foot { color: var(--dim); font-size: .76rem; margin-top: 6px; }
  canvas { width: 100%; display: block; height: 200px; }
  .rank-row { display: flex; align-items: center; gap: 10px; margin: 7px 0; font-size: .83rem; }
  .rank-name { width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-bar { flex: 1; height: 9px; background: rgba(148,163,184,.14); border-radius: 999px; overflow: hidden; }
  .rank-bar > i { display: block; height: 100%; background: linear-gradient(90deg,#7c5cff,#5b8cff); border-radius: 999px; }
  .rank-val { width: 64px; text-align: right; color: var(--dim); }
  .chatbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .chat-item { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 8px 0; cursor: pointer; }
  .chat-item:hover { background: rgba(124,92,255,.07); }
  .chat-item b { font-size: .86rem; }
  .chat-item span { display: block; color: var(--dim); font-size: .76rem; margin-top: 2px; }
  .chat-detail { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  .tabs { display: flex; gap: 6px; margin: 6px 0 14px; flex-wrap: wrap; }
  .tab { background: transparent; border: 1px solid var(--line); color: var(--dim); padding: 7px 14px;
    border-radius: 999px; font-size: .82rem; cursor: pointer; width: auto; margin: 0; }
  .tab[aria-selected=true] { background: rgba(124,92,255,.18); border-color: rgba(124,92,255,.55); color: #cfc6ff; }
  table { width: 100%; border-collapse: collapse; font-size: .84rem; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight: 600; font-size: .76rem; text-transform: uppercase; letter-spacing: .04em; }
  tr:hover td { background: rgba(124,92,255,.06); }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .72rem; font-weight: 600; }
  .pill.reading { background: rgba(34,197,94,.16); color: #6ee7a2; }
  .pill.followup { background: rgba(245,158,11,.16); color: #fbbf24; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: .79rem; color: var(--dim); }
  .q { color: #d8dcf0; }
  pre { background: #0e1428; border: 1px solid var(--line); border-radius: 12px; padding: 14px;
    overflow: auto; font-size: .78rem; max-height: 60vh; }
  .empty { color: var(--dim); text-align: center; padding: 28px 0; font-size: .88rem; }
  .hidden { display: none !important; }
  .foot { color: var(--dim); font-size: .74rem; margin-top: 26px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">

  <section id="loginView" class="card login">
    <h1>管理台</h1>
    <p class="sub">請輸入帳號與密碼</p>
    <label for="adminUser">帳號</label>
    <input id="adminUser" type="text" autocomplete="username" placeholder="帳號" />
    <label for="adminPass">密碼</label>
    <input id="adminPass" type="password" autocomplete="current-password" placeholder="密碼" />
    <button id="loginBtn" type="button">登入</button>
    <p class="err" id="loginErr"></p>
  </section>

  <section id="dashView" class="hidden">
    <div class="head">
      <div>
        <h1>使用紀錄</h1>
        <p class="sub" id="dashSub">—</p>
      </div>
      <div>
        <button class="ghost" id="refreshBtn" type="button">重新載入</button>
        <button class="ghost" id="exportBtn" type="button">匯出 JSON</button>
        <button class="ghost" id="logoutBtn" type="button">登出</button>
      </div>
    </div>

    <div class="kpis">
      <div class="kpi"><div class="n" id="kVisitor">–</div><div class="l">驗證訪客（不重複名單）</div></div>
      <div class="kpi"><div class="n" id="kEvent">–</div><div class="l">使用事件（解讀＋追問）</div></div>
      <div class="kpi"><div class="n" id="kWeek">–</div><div class="l">統計週（UTC 週一）</div></div>
      <div class="kpi"><div class="n" id="kTime" style="font-size:1rem">–</div><div class="l">最後載入時間</div></div>
    </div>

    <div class="charts">
      <div class="card chart-card">
        <div class="chart-head">
          <b>最近 7 日用量</b>
          <span class="legend"><i class="lg reading"></i>解讀 <i class="lg followup"></i>追問</span>
        </div>
        <canvas id="chartDaily" height="200"></canvas>
        <div class="chart-foot" id="chartDailyFoot">—</div>
      </div>
      <div class="card chart-card">
        <div class="chart-head"><b>抽牌方式</b></div>
        <canvas id="chartMode" height="200"></canvas>
        <div class="chart-foot" id="chartModeFoot">—</div>
      </div>
      <div class="card chart-card wide">
        <div class="chart-head"><b>使用者排行（按解讀次數）</b></div>
        <div id="userRank"></div>
      </div>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabVisitors" aria-selected="true" type="button">訪客</button>
      <button class="tab" role="tab" id="tabEvents" aria-selected="false" type="button">事件</button>
      <button class="tab" role="tab" id="tabChats" aria-selected="false" type="button">對話紀錄</button>
      <button class="tab" role="tab" id="tabRaw" aria-selected="false" type="button">原始 JSON</button>
    </div>

    <input id="filter" type="text" placeholder="搜尋：名字／IP／牌名／問題…" style="margin-bottom:14px" />

    <div class="card">
      <div id="paneVisitors"></div>
      <div id="paneEvents" class="hidden"></div>
      <div id="paneChats" class="hidden">
        <div class="chatbar">
          <button class="ghost" id="loadChatsBtn" type="button">載入對話</button>
          <button class="ghost" id="downloadAllBtn" type="button">下載全部 .md</button>
          <span class="chart-foot" id="chatsHint">按「載入對話」讀取。</span>
        </div>
        <div id="chatList"></div>
        <div id="chatView"></div>
      </div>
      <div id="paneRaw" class="hidden"></div>
    </div>

    <p class="foot">本頁不設任何連結，只能直接輸入網址進入。資料每次都即時向 Worker 讀取。</p>
  </section>
</div>

<script>
(function () {
  "use strict";

  var WORKER = "https://ziwe-kevin.www-wongkevin404.workers.dev";
  var API = WORKER + "/visitors";
  var API_BASE = WORKER;
  var ADMIN_USER = "kevin";
  var KEY_STORE = "zwds.admin.key";
  var state = { key: "", data: null, tab: "visitors", chats: [] };

  function $(id) { return document.getElementById(id); }

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function fmt(ts) {
    if (!ts) return "—";
    var d = new Date(Number(ts));
    if (isNaN(d.getTime())) return "—";
    var p = function (n) { return (n < 10 ? "0" : "") + n; };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " +
      p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }

  function setTab(name) {
    state.tab = name;
    $("tabVisitors").setAttribute("aria-selected", String(name === "visitors"));
    $("tabEvents").setAttribute("aria-selected", String(name === "events"));
    $("tabRaw").setAttribute("aria-selected", String(name === "raw"));
    $("paneVisitors").classList.toggle("hidden", name !== "visitors");
    $("paneChats").classList.toggle("hidden", name !== "chats");
    $("tabChats").setAttribute("aria-selected", String(name === "chats"));
    $("paneEvents").classList.toggle("hidden", name !== "events");
    $("paneRaw").classList.toggle("hidden", name !== "raw");
  }

  function match(text) {
    var q = String(($("filter") || {}).value || "").trim().toLowerCase();
    if (!q) return true;
    return String(text == null ? "" : text).toLowerCase().indexOf(q) !== -1;
  }

  function dayKey(ts) {
    var d = new Date(Number(ts));
    if (isNaN(d.getTime())) return "";
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  }

  function fit(canvas) {
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.clientWidth || canvas.parentElement.clientWidth || 320;
    var h = Number(canvas.dataset.h || 200) || 200;
    canvas.style.height = h + "px";
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx: ctx, w: w, h: h };
  }

  function drawDaily(events) {
    var canvas = $("chartDaily");
    if (!canvas) return;
    canvas.dataset.h = "200";
    var days = [];
    var now = new Date();
    for (var i = 6; i >= 0; i -= 1) {
      var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
      var key = d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
      days.push({ key: key, label: (d.getMonth() + 1) + "/" + d.getDate(), reading: 0, followup: 0 });
    }
    var map = {};
    days.forEach(function (d) { map[d.key] = d; });
    events.forEach(function (e) {
      var k2 = dayKey(e.t);
      if (!map[k2]) return;
      if (e.kind === "followup") map[k2].followup += 1;
      else map[k2].reading += 1;
    });

    var g = fit(canvas);
    var ctx = g.ctx, w = g.w, h = g.h;
    var padL = 30, padB = 26, padT = 10, padR = 8;
    var maxV = 1;
    days.forEach(function (d) { maxV = Math.max(maxV, d.reading, d.followup); });
    var chartH = h - padB - padT;
    var slot = (w - padL - padR) / days.length;
    var barW = Math.max(4, slot * 0.28);

    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = "rgba(148,163,184,.18)";
    ctx.fillStyle = "#9aa4bd";
    ctx.font = "11px -apple-system, Segoe UI, sans-serif";
    ctx.lineWidth = 1;
    for (var t = 0; t <= 3; t += 1) {
      var val = Math.round((maxV / 3) * t);
      var y = padT + chartH - (val / maxV) * chartH;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
      ctx.fillText(String(val), 6, y + 4);
    }

    days.forEach(function (d, i) {
      var x = padL + slot * i + slot / 2;
      var rH = (d.reading / maxV) * chartH;
      var fH = (d.followup / maxV) * chartH;
      ctx.fillStyle = "#7c5cff";
      ctx.fillRect(x - barW - 1, padT + chartH - rH, barW, rH);
      ctx.fillStyle = "#f59e0b";
      ctx.fillRect(x + 1, padT + chartH - fH, barW, fH);
      ctx.fillStyle = "#9aa4bd";
      ctx.fillText(d.label, x - 12, h - 8);
    });

    var totalR = 0, totalF = 0;
    days.forEach(function (d) { totalR += d.reading; totalF += d.followup; });
    $("chartDailyFoot").textContent = "7 日合計：解讀 " + totalR + " 次、追問 " + totalF + " 次（追問率 " +
      (totalR ? Math.round((totalF / totalR) * 100) : 0) + "%）";
  }

  function drawMode(events) {
    var canvas = $("chartMode");
    if (!canvas) return;
    canvas.dataset.h = "200";
    var random = 0, click = 0;
    events.forEach(function (e) {
      if (e.kind !== "reading") return;
      if (e.mode === "random") random += 1; else click += 1;
    });
    var g = fit(canvas);
    var ctx = g.ctx, w = g.w, h = g.h;
    ctx.clearRect(0, 0, w, h);
    var total = random + click;
    var cx = w / 2, cy = h / 2, r = Math.min(w, h) / 2 - 18;
    if (!total) {
      ctx.fillStyle = "#9aa4bd";
      ctx.font = "13px -apple-system, Segoe UI, sans-serif";
      ctx.fillText("尚未有數據", cx - 40, cy);
      $("chartModeFoot").textContent = "—";
      return;
    }
    var slices = [{ v: random, c: "#7c5cff" }, { v: click, c: "#22c55e" }];
    var start = -Math.PI / 2;
    slices.forEach(function (s) {
      var ang = (s.v / total) * Math.PI * 2;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, start, start + ang); ctx.closePath();
      ctx.fillStyle = s.c; ctx.fill();
      start += ang;
    });
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.58, 0, Math.PI * 2); ctx.fillStyle = "#141a2e"; ctx.fill();
    ctx.fillStyle = "#e6e9f2"; ctx.font = "700 15px -apple-system, Segoe UI, sans-serif";
    ctx.textAlign = "center"; ctx.fillText(String(total), cx, cy + 2);
    ctx.font = "11px -apple-system, Segoe UI, sans-serif"; ctx.fillStyle = "#9aa4bd";
    ctx.fillText("次解讀", cx, cy + 18); ctx.textAlign = "left";
    $("chartModeFoot").textContent = "隨機 " + random + " 次（" + Math.round((random / total) * 100) + "%）· 自選 " + click + " 次（" + Math.round((click / total) * 100) + "%）";
  }

  function drawRank(events) {
    var box = $("userRank");
    if (!box) return;
    var counts = {};
    events.forEach(function (e) {
      if (e.kind !== "reading") return;
      var n = e.name || "（未填）";
      counts[n] = (counts[n] || 0) + 1;
    });
    var arr = Object.keys(counts).map(function (n) { return { name: n, n: counts[n] }; })
      .sort(function (a, b) { return b.n - a.n; }).slice(0, 8);
    if (!arr.length) { box.innerHTML = '<div class="empty">尚未有數據</div>'; return; }
    var max = arr[0].n || 1;
    var html = "";
    arr.forEach(function (item) {
      html += '<div class="rank-row"><span class="rank-name">' + esc(item.name) + '</span>' +
        '<span class="rank-bar"><i style="width:' + Math.round((item.n / max) * 100) + '%"></i></span>' +
        '<span class="rank-val">' + item.n + ' 次</span></div>';
    });
    box.innerHTML = html;
  }

  function chatsUrl(path) {
    return API_BASE + path + "?key=" + encodeURIComponent(state.key);
  }

  function loadChats() {
    var box = $("chatList");
    var hint = $("chatsHint");
    if (!box) return;
    box.innerHTML = '<div class="empty">載入中…</div>';
    fetch(chatsUrl("/chats"), { headers: { accept: "application/json" } })
      .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, b: b }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error((res.b && res.b.error && res.b.error.message) || "載入失敗");
        var items = (res.b && res.b.items) || [];
        state.chats = items;
        if (!items.length) { box.innerHTML = '<div class="empty">未有對話紀錄（做一次解讀之後就會出現）。</div>'; return; }
        if (res.b && res.b.fallback) {
          box.innerHTML = '<div class="empty">以下係舊式事件（當時未有全文儲存）。做一次新解讀就會有完整對話。</div>';
        }
        var html = "";
        items.slice().reverse().forEach(function (it) {
          var kind = it.kind === "followup" ? "追問" : "解讀";
          html += '<div class="chat-item" data-id="' + esc(it.id) + '"><b>' + esc(it.name || "（未填）") +
            " · " + esc(kind) + "</b><span>" + esc(fmt(it.t)) + " · " +
            esc([it.main, it.support, it.life].filter(Boolean).join("／") || "—") + " · " +
            esc(it.mode === "random" ? "隨機" : "自選") +
            (it.qlen ? " · 問題 " + it.qlen + " 字" : "") +
            (it.mlen ? " · 解讀 " + it.mlen + " 字" : "") + "</span></div>";
        });
        box.innerHTML = (res.b && res.b.fallback ? box.innerHTML : "") + html;
        Array.prototype.forEach.call(box.querySelectorAll(".chat-item"), function (el) {
          el.addEventListener("click", function () { openChat(el.getAttribute("data-id")); });
        });
        if (hint) hint.textContent = "共 " + items.length + " 筆（最近 200 筆）。";
      })
      .catch(function (e) { box.innerHTML = '<div class="empty">' + esc(e.message) + "</div>"; });
  }

  function openChat(id) {
    var view = $("chatView");
    if (!view) return;
    if (!id) { view.innerHTML = '<div class="empty">這筆係舊紀錄，未有全文（做一次新解讀就會有）。</div>'; return; }
    view.innerHTML = '<div class="empty">載入中…</div>';
    fetch(chatsUrl("/chatitem") + "&id=" + encodeURIComponent(id), { headers: { accept: "application/json" } })
      .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, b: b }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error((res.b && res.b.error && res.b.error.message) || "載入失敗");
        var it = res.b.item || {};
        var parts = ['<div class="chat-detail">'];
        parts.push("<b>" + esc(it.name || "（未填）") + "</b> · " + esc(fmt(it.t)) + " · " +
          esc([it.main, it.support, it.life].filter(Boolean).join("／")) + " · " +
          esc(it.mode === "random" ? "隨機抽牌" : "手動選擇"));
        if (it.question) parts.push("<p><b>問：</b>" + esc(it.question) + "</p>");
        if (it.answer) parts.push("<pre>" + esc(it.answer) + "</pre>");
        if (it.markdown) parts.push("<p class='chart-foot'>解讀全文（" + it.markdown.length + " 字）</p><pre>" + esc(it.markdown) + "</pre>");
        parts.push('<p><button class="ghost" id="dlOne" type="button">下載這筆 .md</button></p></div>');
        view.innerHTML = parts.join("");
        var dl = document.getElementById("dlOne");
        if (dl) dl.addEventListener("click", function () { downloadChat(it); });
      })
      .catch(function (e) { view.innerHTML = '<div class="empty">' + esc(e.message) + "</div>"; });
  }

  function chatToMarkdown(it) {
    var lines = [];
    lines.push("# 紫微斗數 AI 解牌 · " + (it.name || "未填"));
    lines.push("");
    lines.push("- 時間：" + fmt(it.t));
    lines.push("- 牌組：" + [it.main, it.support, it.life].filter(Boolean).join("／"));
    lines.push("- 抽牌方式：" + (it.mode === "random" ? "隨機抽牌" : "手動選擇"));
    if (it.markdown) { lines.push(""); lines.push("---"); lines.push(""); lines.push(it.markdown); }
    if (it.question) { lines.push(""); lines.push("## 追問"); lines.push(""); lines.push("**問：** " + it.question); lines.push(""); lines.push(it.answer || ""); }
    return lines.join("\n");
  }

  function saveText(text, name) {
    var blob = new Blob([text], { type: "text/markdown;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
  }

  function downloadChat(it) {
    saveText(chatToMarkdown(it), "zwds-" + (it.name || "chat") + "-" + String(it.id).replace(/[:]/g, "-") + ".md");
  }

  function downloadAllChats() {
    var items = state.chats || [];
    if (!items.length) { alert("未有對話，先按「載入對話」。"); return; }
    var texts = new Array(items.length);
    var done = 0;
    items.forEach(function (meta, i) {
      fetch(chatsUrl("/chatitem") + "&id=" + encodeURIComponent(meta.id), { headers: { accept: "application/json" } })
        .then(function (r) { return r.json(); })
        .then(function (b) { texts[i] = chatToMarkdown(b.item || meta); })
        .catch(function () { texts[i] = chatToMarkdown(meta); })
        .then(function () {
          done += 1;
          if (done === items.length) saveText(texts.join("\n\n---\n\n"), "zwds-all-chats.md");
        });
    });
  }
  function renderCharts() {
    var events = (state.data && Array.isArray(state.data.events)) ? state.data.events : [];
    window.requestAnimationFrame(function () {
      drawDaily(events);
      drawMode(events);
      drawRank(events);
    });
  }

  function render() {
    var data = state.data || {};
    var visitors = Array.isArray(data.recent) ? data.recent.slice().reverse() : [];
    var events = Array.isArray(data.events) ? data.events.slice().reverse() : [];

    $("kVisitor").textContent = String(data.count == null ? visitors.length : data.count);
    $("kEvent").textContent = String(data.eventCount == null ? events.length : data.eventCount);
    $("kWeek").textContent = data.week || "—";
    $("kTime").textContent = fmt(Date.now());
    $("dashSub").textContent = "本週 " + (data.week || "—") + "：驗證訪客 " +
      (data.count || 0) + " 位，事件 " + (data.eventCount || 0) + " 條（最多顯示最近 50 位／80 條）";

    var vRows = visitors.filter(function (v) {
      return match(v.name) || match(v.ip) || match(fmt(v.t));
    });
    var vHtml = "";
    if (!vRows.length) {
      vHtml = '<div class="empty">冇符合的訪客紀錄。</div>';
    } else {
      vHtml += "<table><thead><tr><th>名字</th><th>IP</th><th>驗證時間</th></tr></thead><tbody>";
      vRows.forEach(function (v) {
        vHtml += "<tr><td><b>" + esc(v.name || "（未填）") + "</b></td><td class='mono'>" +
          esc(v.ip || "") + "</td><td class='mono'>" + esc(fmt(v.t)) + "</td></tr>";
      });
      vHtml += "</tbody></table>";
    }
    $("paneVisitors").innerHTML = vHtml;

    var eRows = events.filter(function (e) {
      return match(e.name) || match(e.ip) || match(e.question) || match(e.main) ||
        match(e.support) || match(e.life) || match(e.kind) || match(e.mode) || match(fmt(e.t));
    });
    var eHtml = "";
    if (!eRows.length) {
      eHtml = '<div class="empty">冇符合的事件紀錄。（做一次解讀之後就會出現）</div>';
    } else {
      eHtml += "<table><thead><tr><th>時間</th><th>名字</th><th>類型</th><th>牌組 / 模式</th><th>內容</th></tr></thead><tbody>";
      eRows.forEach(function (e) {
        var kind = e.kind === "followup" ? "追問" : (e.kind === "reading" ? "解讀" : esc(e.kind));
        var cls = e.kind === "followup" ? "followup" : "reading";
        var cards = [e.main, e.support, e.life].filter(Boolean).join(" · ") || "—";
        var body = e.kind === "followup"
          ? '<span class="q">' + esc(e.question || "") + "</span>"
          : '<span class="mono">' + esc(cards) + " · " + esc(e.mode === "random" ? "隨機" : "自選") + "</span>";
        eHtml += "<tr><td class='mono'>" + esc(fmt(e.t)) + "</td><td>" + esc(e.name || "—") +
          "</td><td><span class='pill " + cls + "'>" + kind + "</span></td><td class='mono'>" +
          esc(e.kind === "followup" ? cards : "") + "</td><td>" + body + "</td></tr>";
      });
      eHtml += "</tbody></table>";
    }
    $("paneEvents").innerHTML = eHtml;

    $("paneRaw").innerHTML = "<pre>" + esc(JSON.stringify(data, null, 2)) + "</pre>";

    renderCharts();
  }

  function load() {
    var btn = $("refreshBtn");
    if (btn) btn.disabled = true;
    return fetch(API + "?key=" + encodeURIComponent(state.key), { headers: { accept: "application/json" } })
      .then(function (res) {
        return res.json().catch(function () { return null; }).then(function (body) {
          if (!res.ok) {
            var msg = body && body.error && body.error.message ? body.error.message : ("HTTP " + res.status);
            throw new Error(msg);
          }
          state.data = body;
          render();
        });
      })
      .catch(function (error) {
        $("dashSub").textContent = "載入失敗：" + error.message;
      })
      .then(function () { if (btn) btn.disabled = false; });
  }

  function showDash() {
    $("loginView").classList.add("hidden");
    $("dashView").classList.remove("hidden");
    load();
  }

  function login() {
    var user = String($("adminUser").value || "").trim().toLowerCase();
    var pass = String($("adminPass").value || "");
    var err = $("loginErr");
    err.textContent = "";
    if (user !== ADMIN_USER) { err.textContent = "帳號或密碼不正確。"; return; }
    if (!pass) { err.textContent = "請輸入密碼。"; return; }

    $("loginBtn").disabled = true;
    fetch(API + "?key=" + encodeURIComponent(pass), { headers: { accept: "application/json" } })
      .then(function (res) {
        return res.json().catch(function () { return null; }).then(function (body) {
          if (!res.ok) throw new Error((body && body.error && body.error.message) || ("HTTP " + res.status));
          state.key = pass;
          try { sessionStorage.setItem(KEY_STORE, pass); } catch (e) { /* 忽略 */ }
          state.data = body;
          render();
          showDash();
        });
      })
      .catch(function (error) {
        err.textContent = "登入失敗：" + error.message;
      })
      .then(function () { $("loginBtn").disabled = false; });
  }

  $("loginBtn").addEventListener("click", login);
  $("adminPass").addEventListener("keydown", function (e) { if (e.key === "Enter") login(); });
  $("adminUser").addEventListener("keydown", function (e) { if (e.key === "Enter") $("adminPass").focus(); });
  $("refreshBtn").addEventListener("click", load);
  $("logoutBtn").addEventListener("click", function () {
    state.key = ""; state.data = null;
    try { sessionStorage.removeItem(KEY_STORE); } catch (e) { /* 忽略 */ }
    $("dashView").classList.add("hidden");
    $("loginView").classList.remove("hidden");
    $("adminPass").value = "";
  });
  $("exportBtn").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(state.data || {}, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "zwds-visitors-" + new Date().toISOString().slice(0, 19).replace(/[:.]/g, "-") + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
  });
  $("filter").addEventListener("input", render);
  $("tabVisitors").addEventListener("click", function () { setTab("visitors"); });
  $("tabEvents").addEventListener("click", function () { setTab("events"); });
  $("tabRaw").addEventListener("click", function () { setTab("raw"); });
  $("tabChats").addEventListener("click", function () { setTab("chats"); loadChats(); });
  $("loadChatsBtn").addEventListener("click", loadChats);
  $("downloadAllBtn").addEventListener("click", downloadAllChats);

  window.addEventListener("resize", function () {
    if (state.data) renderCharts();
  });

  try {
    var saved = sessionStorage.getItem(KEY_STORE);
    if (saved) { state.key = saved; showDash(); }
  } catch (e) { /* 忽略 */ }
})();
</script>
</body>
</html>
